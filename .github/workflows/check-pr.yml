name: Check PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check the Worker config
        run: npx wrangler deploy --dry-run
