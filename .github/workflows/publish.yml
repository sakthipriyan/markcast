name: Publish

# A version tag on main publishes the package to npm from this build, never from
# a laptop. npm trusts this workflow directly (trusted publishing over OIDC), so
# there is no npm token anywhere, and --provenance links the package on npmjs.com
# to the commit and run that built it.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        env:
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          if ! git branch -r --contains "$SHA" | grep -E -q '(^|\s)origin/main$'; then
            echo "Error: tag $TAG is not on the main branch."
            exit 1
          fi
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Error: tag $TAG but package.json says $VERSION."
            exit 1
          fi
      # Keep a Changelog puts a version's entries between its heading and the
      # next one. Read before publishing: a release with no notes stops here,
      # before npm has it.
      - name: Take the notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v want="## [$VERSION]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## \[/    { exit }
            found {
              if (NF == 0) { blanks++; next }
              if (started) { for (i = 0; i < blanks; i++) print "" }
              blanks = 0
              started = 1
              print
            }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. Open one before tagging $TAG."
            exit 1
          fi
          echo "Notes for $TAG:"
          cat notes.md
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest
      - name: Publish
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public --provenance
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md
