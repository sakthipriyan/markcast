name: Publish

# A version tag on main is the whole release: it publishes the package to npm,
# waits until npm serves that version, then deploys slidetake.com with the app
# npm has, byte for byte. Merging to main deploys nothing, so the site and the
# package are always the same release.
#
# npm trusts this workflow directly (trusted publishing over OIDC), so there is
# no npm token anywhere, and --provenance links the package on npmjs.com to the
# commit and run that built it.
on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify_tag:
    name: Verify the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        env:
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          if ! git branch -r --contains "$SHA" | grep -E -q '(^|\s)origin/main$'; then
            echo "::error::Tag $TAG is not on the main branch."
            exit 1
          fi

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG but package.json says $VERSION."
            exit 1
          fi

      # Keep a Changelog puts a version's entries between its heading and the
      # next one. Read before anything is published: a release with no notes
      # stops here, before npm or the site has it.
      - name: Take the notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v want="## [$VERSION]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## \[/    { exit }
            found {
              if (NF == 0) { blanks++; next }
              if (started) { for (i = 0; i < blanks; i++) print "" }
              blanks = 0
              started = 1
              print
            }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. Open one before tagging $TAG."
            exit 1
          fi
          echo "Notes for $TAG:"
          cat notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  npm:
    name: Publish to npm
    needs: [verify_tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest
      # A re-run after a later job failed finds the version already on npm: npm
      # never takes the same version twice, so that's done, not an error.
      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          unset NODE_AUTH_TOKEN
          if npm view "slidetake@${TAG#v}" version >/dev/null 2>&1; then
            echo "slidetake@${TAG#v} is already on npm."
          else
            npm publish --access public --provenance
          fi

  website:
    name: Deploy slidetake.com
    needs: [npm]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      # npm can take a moment to serve a version it has just accepted
      - name: Wait for npm to serve the release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for i in $(seq 1 30); do
            if npm view "slidetake@${TAG#v}" version >/dev/null 2>&1; then
              echo "slidetake@${TAG#v} is on npm."
              exit 0
            fi
            echo "Not served yet ($i/30); waiting 20 s."
            sleep 20
          done
          echo "::error::npm still doesn't serve slidetake@${TAG#v} after 10 minutes."
          exit 1

      # The decks, llms.txt and icons come from this commit's build; the app
      # itself is the npm release, so slidetake.com runs exactly what npm has.
      - name: Build, then take the app from npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm run build
          dir=$(mktemp -d)
          (cd "$dir" && npm pack "slidetake@${TAG#v}" --silent >/dev/null && tar xzf ./*.tgz)
          for f in index.html slidetake.js; do
            if ! cmp -s "$dir/package/dist/$f" "dist/$f"; then
              echo "::warning::dist/$f built here differs from the npm release; deploying the npm one."
            fi
            cp "$dir/package/dist/$f" "dist/$f"
          done
          head -1 dist/slidetake.js

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  release:
    name: GitHub release
    needs: [website]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: notes
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi
