name: Publish

# A version tag on main publishes the package to npm from this build, never from
# a laptop. npm trusts this workflow directly (trusted publishing over OIDC), so
# there is no npm token anywhere, and --provenance links the package on npmjs.com
# to the commit and run that built it.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        env:
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          if ! git branch -r --contains "$SHA" | grep -E -q '(^|\s)origin/main$'; then
            echo "Error: tag $TAG is not on the main branch."
            exit 1
          fi
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Error: tag $TAG but package.json says $VERSION."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest
      - name: Publish
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public --provenance
